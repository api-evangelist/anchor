name: Anchor *
description: 'Anchor was a podcast creation, hosting, distribution, and monetization
  platform (anchor.fm), founded in 2015 and backed by GV (Google Ventures) among others.
  Spotify acquired Anchor in 2019 and folded it into its creator tooling, later rebranding
  the product to Spotify for Podcasters and then Spotify for Creators. The anchor.fm
  domain now 302-redirects to Spotify''s creator product (podcasters.spotify.com /
  creators.spotify.com); Anchor never published a standalone public developer API,
  and it no longer operates as an independent company. This profile was surfaced as
  a portfolio company of gv and added to the API Evangelist network as a stub lead;
  enrichment confirms it is an acquired/absorbed brand with no independent developer
  surface to harvest.'
